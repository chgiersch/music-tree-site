      addLabel({ x: sideX(i) + dir[i] * (w + 6), y, text: `${Math.round(hours)} h`, base: 10, color: T.muted, align: i === 0 ? 'right' : 'left' });
    }

    // Column heads and a scale for each side.
    for (const i of [0, 1]) {
      addLabel({ x: sideX(i) + dir[i] * BAR / 2, y: -34, text: [A, B][i], base: 16, weight: 700 });
      for (const t of bx.ticks(4).slice(1)) {
        addLine(sideX(i) + dir[i] * bx(t), -16, sideX(i) + dir[i] * bx(t), -10, { stroke: T.line });
        addLabel({ x: sideX(i) + dir[i] * bx(t), y: -22, text: `${t} h`, base: 10, color: T.muted });
      }
    }

    header(`shared, by hours you both have`);
    for (const r of spine) {
      const a = pseudo(r.name, r.hours[0] + r.hours[1]), p = paint(a);
      const html = `<b>${r.name}</b><br>${r.family}<br>${A} ${r.hours[0]} h since ${r.first[0]}<br>${B} ${r.hours[1]} h since ${r.first[1]}`;
      addLabel({ x: 0, y, text: r.name, base: 12, weight: 500, fitw: MID * 2 - 20 });
      bar(0, r.hours[0], p, false, cmpHit(r.name, html));
      bar(1, r.hours[1], p, false, cmpHit(r.name, html));
      // A faint tick at equal hours makes duets jump out.
      y += PITCH;
    }

    header(`each other's year: current favourites the other is not playing`);
    const rows = Math.max(own[0].length, own[1].length);
    for (let k = 0; k < rows; k++) {
      for (const i of [0, 1]) {
        const r = own[i][k];
        if (!r) continue;
        const a = pseudo(r.name, r.hours), p = paint(a);
        const other = cmp.shared.find(s => s.name === r.name);
        addLabel({ x: sideX(i) - dir[i] * 8, y, text: r.name, base: 12, align: i === 0 ? 'left' : 'right', fitw: MID - 14 });
        bar(i, r.hours, p, false, cmpHit(r.name, `<b>${r.name}</b><br>${r.family}<br>${[A, B][i]} this year: ${r.hours} h<br>${[B, A][i]}: ${other ? other.hours[1 - i] + ' h all time' : 'never played'}`));
      }
      y += PITCH;
    }

    header(`you might like: next to artists you already love`);
    const brows = Math.max(bridges[0].length, bridges[1].length);
    for (let k = 0; k < brows; k++) {
      for (const i of [0, 1]) {
        const b = bridges[i][k];
        if (!b) continue;
        const a = pseudo(b.name, b.hours), p = paint(a);
        addLabel({ x: sideX(i) - dir[i] * 8, y, text: `${i === 0 ? '→ ' : ''}${b.name}${i === 1 ? ' ←' : ''}`, base: 12, align: i === 0 ? 'left' : 'right', fitw: MID - 14 });
        bar(i, b.hours, p, true, cmpHit(b.name, `<b>${b.name}</b><br>${b.family}<br>${[A, B][i]} ${b.hours} h; new to ${[B, A][i]}<br>sits next to ${b.via.join(', ')}`));
      }
      y += PITCH;
    }
    addLabel({ x: 0, y: y + 6, text: `outlined bars are ${A}'s picks for ${B} (left) and ${B}'s for ${A} (right)`, base: 10, color: T.muted });

    // The card: three lines above the column heads. Kept short on purpose;
    // every extra line here shrinks the whole chart to fit the screen.
    const o = cmp.overlap, mp = cmp.most_played;
    const peak = cmp.clock.map(c => d3.maxIndex(c));
    const lines = [
      `${A} & ${B}`,
      `overlap ${o.weighted} · ${o.shared_artists} shared artists · ${o.shared_recent} both played this year · ${cmp.duets.length} duets · ${cmp.same_day.length} same-song-same-day moments`,
      `most played ever: ${A} "${mp[0].track}" (${mp[0].artist}), ${B} "${mp[1].track}" (${mp[1].artist}) · peak hour ${peak[0]}:00 and ${peak[1]}:00`,
    ];
    lines.forEach((t, i) => addLabel({ x: 0, y: -96 + i * 17, text: t, base: i === 0 ? 16 : 11, weight: i === 0 ? 700 : 400, color: i === 0 ? T.fg : T.muted }));
  }

  // ---- Past: how the two tastes moved by year. A similarity line (cosine
  // of the artist-hours vectors), with each year's shared artists listed
  // under the axis and pick-ups above it: artists one person started that
  // the other had already been playing.
  function past(vis) {
    const [A, B] = cmp.people;
    const yrs = cmp.years.filter(y => y.hours[0] && y.hours[1]);
    const solo = cmp.years.filter(y => !(y.hours[0] && y.hours[1]));
    const W = 1200, H = 300, LEFT = 70, COLW = (W - LEFT - 30) / Math.max(1, cmp.years.length);
    const x = y => LEFT + COLW * (cmp.years.indexOf(y) + 0.5);
    const ys = d3.scaleLinear().domain([0, Math.max(0.2, d3.max(yrs, y => y.sim) || 0.2)]).nice().range([H - 30, 30]);
    // Axes.
    addLine(LEFT, 30, LEFT, H - 30, { stroke: T.line });
    for (const t of ys.ticks(4)) { addLine(LEFT - 5, ys(t), LEFT, ys(t), { stroke: T.line }); addLabel({ x: LEFT - 8, y: ys(t), text: t.toFixed(2), base: 11, color: T.muted, align: 'right' }); }
    addLabel({ x: LEFT - 50, y: H / 2, text: 'similarity', base: 11, color: T.muted, rotate: -Math.PI / 2 });
    addLine(LEFT, H - 30, W - 30, H - 30, { stroke: T.line });
    cmp.years.forEach(y => addLabel({ x: x(y), y: H - 16, text: String(y.year), base: 12, weight: 600, color: T.muted }));
    // Years only one person has: one label across each run of them, and
    // that person's top artist under each year so the run is not blank.
    let run = [];
    const flush = () => {
      if (!run.length) return;
      const who = run[0].hours[0] ? A : B;
      addLabel({ x: (x(run[0]) + x(run[run.length - 1])) / 2, y: ys(0) - 12, text: `${who} only (${run[0].year}${run.length > 1 ? '–' + run[run.length - 1].year : ''})`, base: 10, color: T.muted });
      run = [];
    };
    cmp.years.forEach(y => { if (!(y.hours[0] && y.hours[1])) run.push(y); else flush(); });
    flush();
    solo.forEach(y => {
      const i = y.hours[0] ? 0 : 1;
      y.tops[i].slice(0, 3).forEach((t, j) => {
        const a = pseudo(t.name, t.hours), p = paint(a);
        addCircle(x(y) - COLW / 2 + 10, H + 18 + j * 16, 4, { fill: p.fill, fillOpacity: p.opacity });
        addLabel({ x: x(y) - COLW / 2 + 18, y: H + 18 + j * 16, text: t.name, base: 11, align: 'left', fitw: COLW - 24, color: T.muted });
      });
    });
    // The line.
    if (yrs.length > 1) {
      const line = d3.line().x(y => x(y)).y(y => ys(y.sim)).curve(d3.curveMonotoneX);
      addPath(line(yrs), { stroke: T.accent, strokeWidth: 2.5, bbox: [LEFT, 0, W, H] });
    }
    // The card behind a year: everything compare.json holds for it.
    const line = (name, right) => `<div class="line"><span>${name}</span><small>${right}</small></div>`;
    const list = (arr, f) => arr.length ? arr.map(f).join('') : '<div class="meta">none</div>';
    const yearCard = y => `<h2>${y.year}</h2><div class="meta">similarity ${y.sim} · ${y.shared} shared artists<br>${A} ${y.hours[0]} h · ${B} ${y.hours[1]} h</div>` +
      `<h3>shared that year</h3>${list(y.top_shared, s => line(s.name, `${s.hours[0]} / ${s.hours[1]} h`))}` +
      `<h3>${A}'s top</h3>${list(y.tops[0], t => line(t.name, t.hours + ' h'))}` +
      `<h3>${B}'s top</h3>${list(y.tops[1], t => line(t.name, t.hours + ' h'))}` +
      `<h3>picked up</h3>${list(y.pickups, p => line(p.name, p.by))}`;
    cmp.years.forEach(y => addRect(x(y) - COLW / 2, H - 26, COLW, 20, { fill: 'none', hit: { data: String(y.year), hover: e => tipAt(e, `<b>${y.year}</b> · tap for the year`), click: () => showCard(yearCard(y)) } }));
    yrs.forEach(y => {
      const r = 4 + Math.sqrt(y.shared) / 2;
      addCircle(x(y), ys(y.sim), r, { fill: T.accent, hit: { ...cmpHit(String(y.year),
        `<b>${y.year}</b> · similarity ${y.sim}<br>${y.shared} shared artists<br>${A} ${y.hours[0]} h: ${y.tops[0].slice(0, 3).map(t => t.name).join(', ')}<br>${B} ${y.hours[1]} h: ${y.tops[1].slice(0, 3).map(t => t.name).join(', ')}<br>tap for the whole year`), click: () => showCard(yearCard(y)) } });
      addLabel({ x: x(y), y: ys(y.sim) - r - 9, text: `${y.shared} shared`, base: 10, color: T.muted });
    });
    // Under the axis: each year's top shared artists, coloured by family.
    const rowY0 = H + 10;
    cmp.years.forEach(y => {
      y.top_shared.forEach((s, i) => {
        const a = pseudo(s.name, s.hours[0] + s.hours[1]), p = paint(a);
        addCircle(x(y) - COLW / 2 + 10, rowY0 + 8 + i * 16, 4, { fill: p.fill, fillOpacity: p.opacity });
        addLabel({ x: x(y) - COLW / 2 + 18, y: rowY0 + 8 + i * 16, text: s.name, base: 11, align: 'left', fitw: COLW - 24 });
      });
      // Pick-ups below the shared list.
      y.pickups.slice(0, 4).forEach((pu, i) => {
        addLabel({ x: x(y) - COLW / 2 + 10, y: rowY0 + 8 + (y.top_shared.length + 0.6 + i) * 16, text: `${pu.by} picked up ${pu.name}`, base: 10, align: 'left', color: T.muted, fitw: COLW - 16 });
      });
    });
    addLabel({ x: LEFT, y: 12, text: `${A} & ${B}, year by year. Dot size is shared artists; under each year, the top shared artists, then who picked up whom.`, base: 11, color: T.muted, align: 'left' });
  }

  // ---- Moments: the small facts, drawn. Four panels from compare.json:
  //   same-day   every day both people played the same song, on a timeline
  //   first      who found a shared artist first: both first-play dates on
  //              one line per artist, with the caveat that Chris's history
  //              only starts 2018-03, so earlier finds are invisible for him
  //   duets      shared artists with near-equal hours
  //   clocks     hours by hour of day, one 24-hour polar chart per person
  function moments(vis) {
    const [A, B] = cmp.people;
    const W = 1200, LEFT = 20;
    const colA = T.accent, colB = T.fam[0];   // person colours for this view only; family colour is not the point here
    let y = 0;
    const title = (t, sub) => { addLabel({ x: LEFT, y, text: t.toUpperCase(), base: 12, weight: 700, color: T.muted, align: 'left' }); if (sub) addLabel({ x: LEFT, y: y + 15, text: sub, base: 11, color: T.muted, align: 'left' }); y += sub ? 36 : 22; };
    const date = s => new Date(s.length === 7 ? s + '-15' : s);

    // --- same song, same day ---------------------------------------------
    const sd = cmp.same_day;
    title(`same song, same day`, `${sd.length} days since ${sd[0]?.date.slice(0, 4) || ''} when you both played the same track`);
    const x = d3.scaleTime().domain([date(cmp.years[0] ? String(d3.max([+cmp.span[0][0].slice(0, 4), +cmp.span[1][0].slice(0, 4)]) + '-01-01') : '2018-01-01'), new Date(tree.generated)]).range([LEFT + 40, W - 40]);
    // Lanes first, then the axis is placed to leave room: each moment
    // takes the lowest lane whose last label ends before this one starts,
    // and lanes alternate above and below the axis so a busy year does
    // not tower. Labels are capped at LW px and shrink to fit.
    const LW = 150, lanes = [], placed = [];
    sd.forEach(m => {
      const mx = x(date(m.date)), w = Math.min(LW, 0.56 * 10 * (m.track.length + 2));
      let lane = lanes.findIndex(end => end < mx - 4);
      if (lane < 0) { lane = lanes.length; lanes.push(0); }
      lanes[lane] = mx + w + 6;
      placed.push({ m, mx, lane });
    });
    const half = Math.ceil(lanes.length / 2);
    const axisY = y + 10 + half * 14 + 6;
    addLine(x.range()[0], axisY, x.range()[1], axisY, { stroke: T.line });
    for (const t of x.ticks(d3.timeYear.every(1))) { addLine(x(t), axisY - 4, x(t), axisY + 4, { stroke: T.line }); addLabel({ x: x(t), y: axisY + half * 14 + 22, text: String(t.getFullYear()), base: 11, color: T.muted }); }
    placed.forEach(({ m, mx, lane }) => {
      const side = lane % 2 === 0 ? -1 : 1, depth = Math.floor(lane / 2);
      const my = axisY + side * (12 + depth * 14);
      addLine(mx, axisY, mx, my, { stroke: T.line });
      addCircle(mx, my, 3.5, { fill: T.accent, hit: cmpHit(m.track, `<b>${m.track}</b><br>${m.artist}<br>${m.date}`) });
      addLabel({ x: mx + 6, y: my, text: m.track, base: 10, align: 'left', color: T.fg, fitw: LW });
    });
    y = axisY + half * 14 + 48;

    // --- who found it first ------------------------------------------------
    const firsts = cmp.shared.slice(0, 36).map(r => ({ ...r, da: date(r.first[0]), db: date(r.first[1]) })).sort((p, q) => p.db - q.db);
    title(`who found it first`, `first play of each shared artist. ${A}'s history starts ${cmp.span[0][0]}, so anything ${B} found before that only looks like hers.`);
    const fx = d3.scaleTime().domain([d3.min(firsts, f => d3.min([f.da, f.db])), new Date(tree.generated)]).range([LEFT + 200, W - 40]);
    for (const t of fx.ticks(d3.timeYear.every(1))) { addLine(fx(t), y - 4, fx(t), y + firsts.length * 17, { stroke: T.line, strokeOpacity: 0.5 }); addLabel({ x: fx(t), y: y - 12, text: String(t.getFullYear()), base: 10, color: T.muted }); }
    // The caveat as a shaded band before Chris's history begins.
    const startA = date(cmp.span[0][0]);
    if (startA > fx.domain()[0]) addRect(fx.range()[0], y - 4, fx(startA) - fx.range()[0], firsts.length * 17, { fill: T.muted, fillOpacity: 0.06 });
    firsts.forEach((f, i) => {
      const fy = y + 6 + i * 17, xa = fx(f.da), xb = fx(f.db);
      const who = f.da < f.db ? A : B, lead = Math.round(Math.abs(f.da - f.db) / (365.25 * 864e5) * 10) / 10;
      addLabel({ x: LEFT + 190, y: fy, text: f.name, base: 11, align: 'right', fitw: 185 });
      addLine(Math.min(xa, xb), fy, Math.max(xa, xb), fy, { stroke: T.line, strokeWidth: 2 });
      addCircle(xa, fy, 4, { fill: colA, hit: cmpHit(f.name, `<b>${f.name}</b><br>${A} first ${f.first[0]}, ${B} first ${f.first[1]}<br>${who} by ${lead} years`) });
      addCircle(xb, fy, 4, { fill: colB, hit: cmpHit(f.name, `<b>${f.name}</b><br>${A} first ${f.first[0]}, ${B} first ${f.first[1]}<br>${who} by ${lead} years`) });
    });
    const legY = y + 6 + firsts.length * 17 + 8;
    addCircle(LEFT + 200, legY, 4, { fill: colA }); addLabel({ x: LEFT + 208, y: legY, text: A, base: 10, color: T.muted, align: 'left' });
    addCircle(LEFT + 260, legY, 4, { fill: colB }); addLabel({ x: LEFT + 268, y: legY, text: B, base: 10, color: T.muted, align: 'left' });
    y = legY + 40;

    // --- duets and clocks, side by side --------------------------------------
    const duetsY = y;
    title(`duets`, `shared artists where your hours are within 40% of each other`);
    cmp.duets.slice(0, 20).forEach((d, i) => {
      const dy = y + i * 17, a = pseudo(d.name, d.hours[0] + d.hours[1]), p = paint(a);
      addCircle(LEFT + 6, dy, 4, { fill: p.fill, fillOpacity: p.opacity });
      addLabel({ x: LEFT + 16, y: dy, text: `${d.name}  ·  ${Math.round(d.hours[0])} h / ${Math.round(d.hours[1])} h`, base: 11, align: 'left', fitw: 420 });
    });
    // Clocks: two polar area charts, radius = hours in that hour of day.
    const cx0 = 760, cr = 110;
    addLabel({ x: cx0 + 150, y: duetsY, text: 'WHEN YOU LISTEN', base: 12, weight: 700, color: T.muted, align: 'left' });
    addLabel({ x: cx0 + 150, y: duetsY + 15, text: 'hours by hour of day, local time', base: 11, color: T.muted, align: 'left' });
    [0, 1].forEach(i => {
      const cx = cx0 + i * 300, cy = duetsY + 60 + cr;
      const hours = cmp.clock[i], mx = d3.max(hours) || 1;
      const arc = d3.arc().innerRadius(14).outerRadius(h => 14 + (cr - 14) * h / mx).startAngle((h, k) => k * Math.PI / 12).endAngle((h, k) => (k + 1) * Math.PI / 12).padAngle(0.02);
      addCircle(cx, cy, cr, { stroke: T.line });
      hours.forEach((h, k) => {
        const path = new Path2D(arc(h, k));
        const t = new Path2D(); const m = new DOMMatrix().translate(cx, cy); t.addPath(path, m);
        addPath(t, { fill: i === 0 ? colA : colB, fillOpacity: 0.8, hit: cmpHit(String(k), `<b>${[A, B][i]}</b><br>${k}:00 to ${k + 1}:00<br>${Math.round(h)} h all time`), bbox: [cx - cr, cy - cr, cx + cr, cy + cr] });
      });
      [0, 6, 12, 18].forEach(k => { const ang = k * Math.PI / 12 - Math.PI / 2; addLabel({ x: cx + Math.cos(ang) * (cr + 12), y: cy + Math.sin(ang) * (cr + 12), text: `${k}:00`, base: 10, color: T.muted }); });
      addLabel({ x: cx, y: cy + cr + 28, text: `${[A, B][i]} · peak ${d3.maxIndex(hours)}:00`, base: 12, weight: 600 });
    });
  }


  // ========== account views (need account.json) ============================
  // The Account Data export is the curation half of a listening life:
  // playlists with the date each song was added, Spotify's own fandom
  // labels, and the Wrapped and taste-profile summaries. Three views.

  // Break prose into lines of at most `max` characters at word boundaries,
  // dropping the **bold** marks Spotify puts in its taste paragraphs.
  function wrapText(s, max) {
    const words = (s || '').replace(/\*\*/g, '').split(/\s+/).filter(Boolean), lines = [];
    let cur = '';
    for (const w of words) { if (cur && (cur + ' ' + w).length > max) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; }
    if (cur) lines.push(cur);
    return lines;
  }
  const viewTitle = (y, t, sub) => { addLabel({ x: 20, y, text: t.toUpperCase(), base: 12, weight: 700, color: T.muted, align: 'left' }); if (sub) addLabel({ x: 20, y: y + 15, text: sub, base: 11, color: T.muted, align: 'left' }); return y + (sub ? 40 : 24); };

  // ---- Diary: every playlist as a row, its songs as dots at the date they
  // were added, coloured by genre family. A dot with a dark ring is an
  // artist the other person plays (an hour or more). Seasonal playlists
  // are in bold. Songs added the same day fan out to the right so a
  // playlist built in one sitting reads as a bead, not a single dot.
  function diary(vis) {
    const [A, B] = acct.people;
    // Two columns, one person each, so 100-odd playlists do not make one
    // tall strip that fits at a tenth of its size (first draft, 2026-11-03).
    const COLW = 760, LEFT = 20, LABELW = 190, PITCH = 16;
    let y = viewTitle(0, 'playlist diary', `${A}: ${acct.diary[0].length} playlists · ${B}: ${acct.diary[1].length} · one row each, songs as dots at the date they were added · ring = the other person plays that artist · bold = seasonal`);
    const top = y;
    acct.diary.forEach((rows, i) => {
      const other = [B, A][i], X0 = LEFT + i * COLW, XL = X0 + LABELW, XT = XL + 14;
      const x = d3.scaleTime().domain([new Date(rows[0].items[0].d), new Date(acct.generated)]).range([XT, X0 + COLW - 30]);
      y = top;
      addLabel({ x: X0, y, text: `${[A, B][i]} · ${rows.length} playlists, ${d3.sum(rows, r => r.n)} songs`, base: 14, weight: 700, align: 'left' });
      y += 30;
      const y0 = y;
      for (const t of x.ticks(d3.timeYear.every(1))) { addLine(x(t), y0 - 8, x(t), y0 + rows.length * PITCH - 6, { stroke: T.line, strokeOpacity: 0.6 }); addLabel({ x: x(t), y: y0 - 14, text: String(t.getFullYear()), base: 10, color: T.muted }); }
      rows.forEach(pl => {
        addLabel({ x: XL, y, text: pl.name, base: 11, align: 'right', fitw: LABELW, weight: pl.season ? 700 : 400, color: pl.season ? T.fg : T.muted });
        const x0 = x(new Date(pl.items[0].d)), x1 = x(new Date(pl.items[pl.items.length - 1].d));
        addLine(x0, y, Math.max(x1, x0 + 1), y, { stroke: T.line });
        for (const [d, its] of d3.group(pl.items, it => it.d)) {
          its.forEach((it, k) => {
            const a = pseudo(it.a, it.o || 1); a.family = it.f;
            const p = paint(a);
            addCircle(x(new Date(d)) + k * 2.6, y, 2.8, { fill: p.fill, fillOpacity: p.opacity, stroke: it.o >= 1 ? T.fg : null, strokeWidth: 1.2,
              hit: cmpHit(it.t, `<b>${it.t}</b><br>${it.a} · ${it.f}<br>added ${it.d} to "${pl.name}"<br>${other}: ${it.o >= 0.1 ? it.o + ' h' : 'never played'}`) });
          });
        }
        y += PITCH;
      });
    });
  }

  // ---- Marquee: Spotify's own label for each person's relationship to an
  // artist, for the artists it has labelled for both. A four-by-four grid,
  // Chris's level across, Meghan's down; names sit in the cell where the
  // two labels meet. The diagonal is agreement; the corners are one
  // person's superfan artist the other barely plays.
  function marquee(vis) {
    const [A, B] = acct.people, M = acct.marquee;
    const short = ['super', 'moderate', 'light', 'previously active'];
    const CW = 300, CH = 220, LEFT = 150, TOP = 80, ROWH = 13, MAXN = Math.floor((CH - 28) / ROWH);
    viewTitle(0, 'marquee', `Spotify's fandom label for the ${M.shared.length} artists it has labelled for both of you · across: ${A} · down: ${B} · counts in each cell`);
    const cells = d3.group(M.shared, r => `${r.level[0]},${r.level[1]}`);
    short.forEach((s, i) => {
      addLabel({ x: LEFT + CW * (i + 0.5), y: TOP - 12, text: `${A}: ${s}`, base: 12, weight: 600 });
      addLabel({ x: LEFT - 10, y: TOP + CH * (i + 0.5), text: `${B}: ${s}`, base: 12, weight: 600, align: 'right', fitw: LEFT - 30 });
    });
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      const x0 = LEFT + CW * i, y0 = TOP + CH * j, rows = cells.get(`${i},${j}`) || [];
      addRect(x0, y0, CW, CH, { stroke: T.line, fill: i === j ? T.accent : 'none', fillOpacity: 0.05 });
      addLabel({ x: x0 + CW - 8, y: y0 + 14, text: String(rows.length), base: 11, color: T.muted, align: 'right' });
      rows.slice(0, MAXN).forEach((r, k) => {
        const a = pseudo(r.name, r.hours[0] + r.hours[1]); a.family = r.family;
        const p = paint(a), ly = y0 + 16 + k * ROWH;
        addCircle(x0 + 12, ly, 3.5, { fill: p.fill, fillOpacity: p.opacity });
        addLabel({ x: x0 + 20, y: ly, text: `${r.name}  ${Math.round(r.hours[0])} / ${Math.round(r.hours[1])} h`, base: 10.5, align: 'left', fitw: CW - 44,
          hit: cmpHit(r.name, `<b>${r.name}</b><br>${A}: ${short[i]} listener, ${r.hours[0]} h<br>${B}: ${short[j]} listener, ${r.hours[1]} h`) });
      });
      if (rows.length > MAXN) addLabel({ x: x0 + 20, y: y0 + 16 + MAXN * ROWH, text: `+${rows.length - MAXN} more`, base: 10, color: T.muted, align: 'left' });
    }
  }

  // ---- Wrapped: the two 2025 summaries side by side, with Spotify's
  // prose about each taste, the festival persona, and the last five weeks
  // from the Sound Capsule (which is where the gift playlist shows up).
  function wrapped(vis) {
    const [A, B] = acct.people, COLW = 600, GAP = 50, LEFT = 20;
    acct.wrapped.forEach((w, i) => {
      const x0 = LEFT + i * (COLW + GAP);
      let y = 0;
      const line = (t, o = {}) => { addLabel({ x: x0, y, text: t, base: 11, align: 'left', fitw: COLW, ...o }); y += 15; };
      const head = t => { y += 12; addLabel({ x: x0, y, text: t.toUpperCase(), base: 11, weight: 700, color: T.muted, align: 'left' }); y += 18; };
      addLabel({ x: x0, y, text: `${[A, B][i]} · 2025`, base: 20, weight: 700, align: 'left' }); y += 30;
      if (!w) { line('no Wrapped file in this export', { color: T.muted }); return; }
      line(`${w.minutes.toLocaleString()} minutes · ${w.unique_artists.toLocaleString()} artists · ${w.unique_tracks.toLocaleString()} songs · listening age ${w.listening_age}` + (w.popularity != null ? ` · average song popularity ${Math.round(w.popularity * 100)}` : ''), { color: T.muted });
      head('top artists'); w.top_artists.forEach((a, k) => line(`${k + 1}. ${a}`, { weight: k === 0 ? 600 : 400 }));
      if (w.top_fan_percentile != null) line(`top ${(w.top_fan_percentile * 100).toFixed(2)}% of ${w.top_artists[0]}'s listeners`, { color: T.muted });
      head('top songs'); w.top_tracks.forEach((t, k) => line(`${k + 1}. ${t.name}  ·  ${t.count} plays`));
      head('top albums'); w.top_albums.forEach((a, k) => line(`${k + 1}. ${a}`));
      if (w.club) { head(`club ${w.club} · ${w.club_role}`); line(w.club_artists.join(' · ')); }
      head('spotify on your taste'); wrapText(w.identity, 95).forEach(l => line(l));
      head('when you listen'); wrapText(w.rhythms, 95).forEach(l => line(l));
      if (w.festival && w.festival.name) { head(`${w.festival.name} lineup match`); line(`${w.festival.persona} · matched ${w.festival.percentile}th percentile · ${w.festival.artists.join(', ')}`); }
      head('last five weeks (sound capsule)');
      (acct.capsule[i] || []).forEach(c => line(`${c.date}  ${c.hours} h  ·  ${c.artists.slice(0, 5).map(a => a.name).join(', ')}`));
    });
  }

  // ---------- playlist tray ---------------------------------------------------
  // Seeds are whatever was tapped: a song (mind map rows, side panel), an
  // artist (+ beside an open node, side panel button) or a genre (legend
  // chip). Build ranks the tree by closeness to the seeds and fills a list
  // from the songs we play (tree.json; the other person's from
  // compare.json) or from the recommender's pool (picks.json), skipping
  // every song already in a made playlist. Copy gives Spotify links, one
  // per line, for pasting into a playlist in the desktop app. Saving
  // straight to Spotify needs a login from the page; not built yet.
  const tray = document.getElementById('tray'), trayMsg = document.getElementById('traymsg');
  const seeds = [];                 // {kind, key, name, a?, uri?}
  const seedIds = new Set();        // artist ids among the seeds, for the ring
  const build = { who: 'me', pool: 'played', len: '30', list: [] };
  const ME = () => tree.person || 'me', THEM = () => other()?.person || null;
  function addSeed(s) {
    if (seeds.some(x => x.key === s.key)) { trayMsg.textContent = `${s.name} is already a seed`; return; }
    seeds.push(s); if (s.a) seedIds.add(s.a.id);
    trayMsg.textContent = ''; syncTray(); draw(true);
  }
  function removeSeed(key) {
    const i = seeds.findIndex(s => s.key === key); if (i < 0) return;
    const [s] = seeds.splice(i, 1);
    if (s.a && !seeds.some(x => x.a?.id === s.a.id)) seedIds.delete(s.a.id);
    syncTray(); draw(true);
  }
  const dial = (id, key) => { const el = document.getElementById(id);
    el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { build[key] = b.dataset.v; syncTray(); }));
    return () => el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === build[key]))); };
  const syncWho = dial('who', 'who'), syncPool = dial('pool', 'pool'), syncLen = dial('len', 'len');
  const yearOnly = document.getElementById('yearonly');
  function syncTray() {
    tray.hidden = !seeds.length && !build.list.length;
    d3.select('#seeds').selectAll('button').data(seeds, s => s.key).join('button').attr('class', 'chip').attr('title', 'remove')
      .text(s => (s.kind === 'genre' ? '◆ ' : s.kind === 'song' ? '♪ ' : '') + s.name).on('click', (e, s) => removeSeed(s.key));
    document.getElementById('who').hidden = !other();
    document.querySelector('#who [data-v=me]').textContent = ME(); document.querySelector('#who [data-v=them]').textContent = THEM() || 'them';
    document.getElementById('pool').hidden = !picks;
    yearOnly.parentElement.hidden = !state.year; yearOnly.nextElementSibling.textContent = state.year || '';
    syncWho(); syncPool(); syncLen(); saveTray();
    d3.select('#result').selectAll('li').data(build.list, t => t.uri).join('li').attr('title', 'remove')
      .html(t => `<b>${t.name}</b> <span>${t.artist}</span><small>${t.reason}</small>`)
      .on('click', (e, t) => { build.list = build.list.filter(x => x.uri !== t.uri); syncTray(); });
  }
  document.getElementById('trayclear').addEventListener('click', () => { seeds.length = 0; seedIds.clear(); build.list = []; trayMsg.textContent = ''; syncTray(); draw(true); });
  document.getElementById('buildbtn').addEventListener('click', buildList);
  document.getElementById('copy').addEventListener('click', async () => {
    const text = build.list.map(t => 'https://open.spotify.com/track/' + t.uri.split(':').pop()).join('\n') + '\n';
    try { await navigator.clipboard.writeText(text); trayMsg.textContent = `copied ${build.list.length} links: paste into a playlist in the Spotify desktop app`; }
    catch (e) { const ta = document.getElementById('clip'); ta.value = text; ta.hidden = false; ta.select(); trayMsg.textContent = 'select all in the box and copy'; }
  });

  // ---------- Spotify from the page ---------------------------------------
  // Authorization Code with PKCE: the flow Spotify provides for apps with
  // no server to hold a secret. The page sends the user to Spotify with a
  // hashed one-time code, gets an authorization code back on this same
  // URL, and trades it for tokens with the unhashed code. Tokens live in
  // localStorage; the refresh token renews them silently. Development Mode
  // (verified 2026-11-04) refuses to create a playlist but fills one the
  // user owns, so Save asks for an existing playlist to put the songs in.
  const SP_TOKEN = 'musictree-spotify', SP_VERIFIER = 'musictree-verifier', SP_USED = 'musictree-used';
  const SCOPES = 'playlist-read-private playlist-modify-private playlist-modify-public';
  const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/, '');
  const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const spToken = () => { try { return JSON.parse(localStorage.getItem(SP_TOKEN) || 'null'); } catch (e) { return null; } };
  async function spotifyLogin() {
    const raw = crypto.getRandomValues(new Uint8Array(48)), verifier = b64url(raw);
    localStorage.setItem(SP_VERIFIER, verifier);
    saveTray();                                   // the redirect reloads the page; the list must survive it
    const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    const q = new URLSearchParams({ client_id: spotifyId, response_type: 'code', redirect_uri: redirectUri(), scope: SCOPES,
      code_challenge_method: 'S256', code_challenge: challenge, state: location.hash.slice(1) || 'mindmap' });
    location.assign('https://accounts.spotify.com/authorize?' + q);
  }
  async function tokenRequest(body) {
    const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ client_id: spotifyId, ...body }) });
    if (!r.ok) throw new Error('token ' + r.status);
    const t = await r.json();
    const saved = { access: t.access_token, refresh: t.refresh_token || spToken()?.refresh, exp: Date.now() + (t.expires_in - 60) * 1000 };
    localStorage.setItem(SP_TOKEN, JSON.stringify(saved));
    return saved;
  }
  // On the way back from Spotify the URL carries ?code=; trade it, then
  // put the URL back the way it was (the hash is the view we left from).
  async function spotifyCallback() {
    const q = new URLSearchParams(location.search), code = q.get('code');
    if (!code) return;
    const verifier = localStorage.getItem(SP_VERIFIER);
    history.replaceState(null, '', location.pathname + '#' + (q.get('state') || 'mindmap'));
    if (!verifier) return;
    try { await tokenRequest({ grant_type: 'authorization_code', code, redirect_uri: redirectUri(), code_verifier: verifier }); trayMsg.textContent = 'signed in to Spotify'; }
    catch (e) { trayMsg.textContent = 'Spotify sign-in failed: ' + e.message; }
    localStorage.removeItem(SP_VERIFIER);
  }
  async function spotifyFetch(path, opts = {}) {
    let t = spToken();
    if (!t) throw new Error('not signed in');
    if (Date.now() > t.exp) t = await tokenRequest({ grant_type: 'refresh_token', refresh_token: t.refresh });
    const r = await fetch('https://api.spotify.com/v1/' + path, { ...opts, headers: { Authorization: 'Bearer ' + t.access, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
    if (r.status === 401) { localStorage.removeItem(SP_TOKEN); throw new Error('signed out by Spotify; sign in again'); }
    if (!r.ok) throw new Error(`${r.status} on ${path.split('?')[0]}` + (r.status === 403 ? ' (Development Mode or scope)' : ''));
    return r.status === 204 ? null : r.json();
  }
  const saver = document.getElementById('saver'), target = document.getElementById('target');
  async function openSaver() {
    if (!spotifyId) { trayMsg.textContent = 'no spotify.json beside the page: run deploy'; return; }
    if (!build.list.length) { trayMsg.textContent = 'build a list first'; return; }
    if (!spToken()) return spotifyLogin();
    trayMsg.textContent = 'reading your playlists…';
    try {
      const me = (await spotifyFetch('me')).id;
      const mine = [];
      for (let url = 'me/playlists?limit=50'; url;) { const page = await spotifyFetch(url); mine.push(...page.items.filter(p => p.owner.id === me)); url = page.next ? page.next.replace('https://api.spotify.com/v1/', '') : null; }
      if (!mine.length) { trayMsg.textContent = 'you own no playlists yet: make an empty private one in Spotify, then try again'; return; }
      d3.select(target).selectAll('option').data(mine, p => p.id).join('option').attr('value', p => p.id).text(p => `${p.name}${p.public ? ' (public)' : ''} · ${p.tracks?.total ?? ''}`);
      saver.hidden = false;
      trayMsg.textContent = 'Spotify blocks making a playlist from here, so pick one of yours (an empty private one is the usual choice)';
    } catch (e) { trayMsg.textContent = 'Spotify: ' + e.message; }
  }
  async function saveTo(replace) {
    const id = target.value, uris = build.list.map(t => t.uri), name = document.getElementById('plname').value.trim();
    if (!id || !uris.length) return;
    trayMsg.textContent = 'saving…';
    try {
      for (let i = 0; i < uris.length; i += 100) {
        const method = replace && i === 0 ? 'PUT' : 'POST';
        await spotifyFetch(`playlists/${id}/items`, { method, body: JSON.stringify({ uris: uris.slice(i, i + 100) }) });
      }
      let renamed = '';
      if (name) { try { await spotifyFetch(`playlists/${id}`, { method: 'PUT', body: JSON.stringify({ name }) }); renamed = `, renamed to “${name}”`; } catch (e) { renamed = ' (renaming was refused; do it in Spotify)'; } }
      // Remember what went out, so the next build skips it like the ledger does.
      const used = new Set(JSON.parse(localStorage.getItem(SP_USED) || '[]')); uris.forEach(u => used.add(u));
      localStorage.setItem(SP_USED, JSON.stringify([...used]));
      trayMsg.textContent = `${uris.length} songs ${replace ? 'now make up' : 'added to'} “${target.selectedOptions[0].text.split(' · ')[0]}”${renamed}`;
      saver.hidden = true;
    } catch (e) { trayMsg.textContent = 'Spotify: ' + e.message; }
  }
  document.getElementById('save').addEventListener('click', openSaver);
  document.getElementById('saveadd').addEventListener('click', () => saveTo(false));
  document.getElementById('savereplace').addEventListener('click', () => saveTo(true));
  document.getElementById('splogout').addEventListener('click', () => { localStorage.removeItem(SP_TOKEN); saver.hidden = true; trayMsg.textContent = 'Spotify login forgotten on this device'; });

  // The tray survives a reload (and the sign-in round trip): seeds by
  // artist id, the built list whole. Seeds from the other person's tree
  // are dropped on restore, since ids are per tree.
  const TRAY_KEY = 'musictree-tray';
  function saveTray() {
    try { localStorage.setItem(TRAY_KEY, JSON.stringify({ seeds: seeds.map(s => ({ kind: s.kind, key: s.key, name: s.name, aid: s.a?.id, uri: s.uri })), list: build.list, who: build.who, pool: build.pool, len: build.len })); } catch (e) {}
  }
  function restoreTray() {
    let t; try { t = JSON.parse(localStorage.getItem(TRAY_KEY) || 'null'); } catch (e) {}
    if (!t) return;
    for (const s of t.seeds || []) { const a = s.aid ? byId.get(s.aid) : null; if (s.aid && !a) continue; seeds.push({ ...s, a }); if (a) seedIds.add(a.id); }
    build.list = t.list || []; build.who = t.who || build.who; build.pool = t.pool || build.pool; build.len = t.len || build.len;
  }

  // Closeness of every tree artist to the seeds: 1 for a seed, 0.6 one
  // link away (parent, child, co-listening partner), 0.25 two away, 0.5
  // for sitting in a seeded genre. The best reason is kept for the list.
  function proximity() {
    const score = new Map(), why = new Map();
    const bump = (id, v, reason) => { if ((score.get(id) || 0) < v) { score.set(id, v); why.set(id, reason); } };
    const genres = new Set(seeds.filter(s => s.kind === 'genre').map(s => s.name));
    for (const a of artists) if (genres.has(a.family)) bump(a.id, 0.5, a.family);
    for (const s of seeds) {
      if (!s.a) continue;
      bump(s.a.id, 1, 'seed');
      for (const n1 of nbr.get(s.a.id) || []) {
        if (n1 === s.a.id) continue;
        bump(n1, 0.6, `next to ${s.a.name}`);
        for (const n2 of nbr.get(n1) || []) if (n2 !== s.a.id) bump(n2, 0.25, `near ${s.a.name}`);
      }
    }
    return { score, why };
  }
  function buildList() {
    if (!seeds.length) { trayMsg.textContent = 'tap a song, an artist or a genre first'; return; }
    const { score, why } = proximity();
    const ok = a => !(state.year && yearOnly.checked) || (a.years?.[state.year] > 0);
    const rankedA = artists.filter(a => score.has(a.id) && ok(a)).sort((p, q) => score.get(q.id) - score.get(p.id) || w(q) - w(p));
    const usedSet = new Set([...(picks?.used || []), ...JSON.parse(localStorage.getItem(SP_USED) || '[]')]), taken = new Set(), out = [];
    const push = (track, artist, reason) => {
      if (!track?.uri || usedSet.has(track.uri) || taken.has(track.uri)) return false;
      taken.add(track.uri); out.push({ name: track.name, artist, uri: track.uri, reason }); return true;
    };
    const me = ME(), them = THEM();
    for (const s of seeds) if (s.kind === 'song') push({ name: s.name, uri: s.uri }, s.a.name, 'you picked it');
    // One source per generator; each yields the next song by the next
    // artist in closeness order, several passes deep, so the list is
    // round-robin across sources and no artist can fill it alone.
    function* played(person) {
      for (let pass = 0; pass < 3; pass++) for (const a of rankedA) {
        if (person === me) { const s = a.songs[pass]; if (s) yield [s, a.name, `${why.get(a.id)} · ${me} plays ${a.name} ${Math.round(a.weight)} h`]; }
        else { const o = otherIndex().get(a.name), s = o?.weight >= 1 ? o.songs?.[pass] : null; if (s) yield [s, a.name, `${why.get(a.id)} · ${them} plays ${a.name} ${Math.round(o.weight)} h`]; }
      }
    }
    function* fresh(person) {
      const pool = person === 'both' ? picks.together : picks.for[person] || [];
      const nameScore = new Map(artists.filter(a => score.has(a.id)).map(a => [a.name, score.get(a.id)]));
      const genres = new Set(seeds.filter(s => s.kind === 'genre').map(s => s.name));
      // A pick scores by how close its anchors are to the seeds; the pool's
      // own order only breaks ties.
      const scored = pool.map((p, i) => ({ p, s: d3.sum(p.via, v => nameScore.get(v) || 0) + (genres.has(p.family) ? 0.5 : 0) - 0.1 * i / pool.length }))
        .filter(x => x.s > 0).sort((x, y) => y.s - x.s);
      for (let pass = 0; pass < 2; pass++) for (const { p } of scored) {
        const t = p.tracks[pass]; if (!t) continue;
        const near = p.via.filter(v => nameScore.has(v)).slice(0, 2).join(', ') || p.via[0];
        yield [t, p.artist, `new to ${person} · near ${near}`];
      }
    }
    const whoList = build.who === 'both' && them ? [me, them] : [build.who === 'them' && them ? them : me];
    const gens = [];
    if (build.pool !== 'new') for (const p of whoList) gens.push(played(p));
    if (build.pool !== 'played' && picks) { for (const p of whoList) gens.push(fresh(p)); if (build.who === 'both') gens.push(fresh('both')); }
    let live = gens;
    while (out.length < +build.len && live.length) {
      live = live.filter(g => { if (out.length >= +build.len) return false; for (;;) { const n = g.next(); if (n.done) return false; if (push(...n.value)) return true; } });
    }
    build.list = out;
    trayMsg.textContent = out.length < +build.len ? `${out.length} songs: the seeds ran out before ${build.len}` : `${out.length} songs`;
    syncTray();
  }

  // ---------- draw ----------------------------------------------------------
  const VIEWS = { mindmap, radial, bubbles, genres, river, duo, past, moments, diary, marquee, wrapped };
  function draw(keep = false) {
    setHues(state.view === 'bubbles' || (state.view === 'river' && ['stacked', 'merged'].includes(state.riverby)) ? HUES_BUBBLES : HUES_TREE);
    const maxEff = d3.max(artists, w) || 1;
    rScale.domain([0, maxEff]); strokeScale.domain([0, maxEff]);
    scene.pos = null; state.hover = null;
    syncView(); syncAge(); syncColour(); syncRiver(); syncOverlay(); syncPerson(); showControls(); drawLegend(); remember();
    nout.textContent = state.n;
    scene.shapes = []; scene.labels = []; scene.bbox = null;
    VIEWS[state.view](visibleSet(state.n));
    showPanel(state.view !== 'mindmap' && state.selected ? byId.get(state.selected) : null);
    syncTray();
    size();
    if (keep) render(); else if (scrolls()) fitWidth(); else fit();
  }
  usePerson(+state.person || 0);
  restoreTray();
  await spotifyCallback();
  draw();
})();
</script>
</body>
</html>
